<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f3f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
  <title>2028학년도 주요대학 이수 권장 과목 안내</title>
  <meta name="description" content="2028학년도 주요 대학의 학과별 핵심 권장 과목과 권장 과목을 대학, 계열, 학과 순서로 고르거나 학과명, 과목명으로 찾아봐요.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322272f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 10 12 5 2 10l10 5 10-5Z'/%3E%3Cpath d='M6 12v5c3 2 9 2 12 0v-5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="controls.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>2028학년도 주요대학 이수 권장 과목</h1>
      <p class="meta">
        <span>최근 수정일 2026. 2. 20.</span>
        <span class="views num" id="views" hidden>오늘 <b id="viewsToday">0</b>명, 전체 <b id="viewsTotal">0</b>명</span>
      </p>
    </div>
  </header>

  <main class="wrap layout">
    <div class="col-main">
      <!-- 찾기 -->
      <section class="card" id="search" aria-labelledby="searchTitle">
        <h2 id="searchTitle">학과나 과목으로 찾기</h2>
        <div class="dt-seg" role="radiogroup" aria-label="찾는 기준">
          <label><input type="radio" name="stype" value="major" checked><span>학과명</span></label>
          <label><input type="radio" name="stype" value="subject"><span>과목명</span></label>
        </div>
        <form class="search-form" id="searchForm" role="search" autocomplete="off">
          <label class="sr-only" for="q">검색어</label>
          <input type="search" id="q" enterkeyhint="search" placeholder="예: 컴퓨터, 경영, 의예과">
          <button class="dt-btn dt-btn--primary search-btn" type="submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            찾기
          </button>
        </form>
        <p class="hint" id="searchHint" aria-live="polite"></p>
        <div id="searchOut"></div>
      </section>

      <!-- 차례로 고르기 -->
      <section class="card" id="pick" aria-labelledby="pickTitle">
        <h2 id="pickTitle">대학부터 차례로 고르기</h2>

        <div class="step" id="step1">
          <h3 class="step-title"><span class="step-no num">1</span>대학</h3>
          <div class="grid" id="uniGrid" role="group" aria-label="대학">
            <p class="state" id="loadState">대학 목록을 불러오고 있어요</p>
          </div>
        </div>

        <div class="step" id="step2" hidden>
          <div class="step-head">
            <h3 class="step-title"><span class="step-no num">2</span>계열</h3>
            <button class="dt-btn dt-btn--ghost dt-btn--s" type="button" data-reset="1">대학 다시 고르기</button>
          </div>
          <div class="grid" id="deptGrid" role="group" aria-label="계열"></div>
        </div>

        <div class="step" id="step3" hidden>
          <div class="step-head">
            <h3 class="step-title"><span class="step-no num">3</span>학과</h3>
            <button class="dt-btn dt-btn--ghost dt-btn--s" type="button" data-reset="2">계열 다시 고르기</button>
          </div>
          <div class="grid" id="majorGrid" role="group" aria-label="학과"></div>
        </div>
      </section>
    </div>

    <!-- 결과 -->
    <aside class="col-side" aria-live="polite">
      <section class="card result" id="result">
        <div class="empty" id="resultEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
          <p>학과를 고르면 여기에<br>권장 과목이 나와요</p>
        </div>
        <div id="resultBody" hidden></div>
      </section>
    </aside>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p>© 2025 양정고등학교 김용현T</p>
      <p>문의 <a href="mailto:bgnlkim@gmail.com">bgnlkim@gmail.com</a></p>
      <p class="src" id="dataNote" hidden></p>
      <div class="fam" data-bgnl-family></div>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="https://bgnl.kr/family.js" defer></script>
</body>
</html>
