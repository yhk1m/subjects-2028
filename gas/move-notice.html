<!--
  새 주소 안내 팝업 (기존 Apps Script 화면용)
  붙이는 법: 기존 Apps Script의 화면 HTML 파일에서 </body> 바로 위에 이 내용을 통째로 붙여 넣고,
  배포 > 배포 관리 > 연필 아이콘 > 버전 「새 버전」 > 배포
-->
<div id="mvBack" role="dialog" aria-modal="true" aria-labelledby="mvTitle" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(18,20,24,.48);font-family:Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;">
  <div style="width:100%;max-width:400px;background:#fff;border-radius:20px;padding:28px 24px 20px;box-shadow:0 8px 32px rgba(0,0,0,.12);color:#22272f;">
    <h2 id="mvTitle" style="margin:0 0 8px;font-size:20px;font-weight:700;letter-spacing:-.4px;line-height:1.4;">새 주소로 옮겼어요</h2>
    <p style="margin:0 0 6px;font-size:16px;line-height:1.6;color:#4d5562;">이 페이지는 더 이상 고치지 않아요. 새 페이지에서 학과나 과목 이름으로 찾고, 결과 주소를 복사해 나눌 수 있어요.</p>
    <p style="margin:0 0 20px;font-size:15px;font-weight:600;color:#22272f;">subjects.bgnl.kr</p>
    <a href="https://subjects.bgnl.kr" target="_top" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#22272f;color:#fff;font-size:16px;font-weight:600;text-decoration:none;">새 페이지로 가기</a>
    <button type="button" id="mvClose" style="display:block;width:100%;height:48px;margin-top:8px;border:0;border-radius:12px;background:transparent;color:#6b7280;font:inherit;font-size:15px;font-weight:500;cursor:pointer;">닫고 이 페이지 보기</button>
  </div>
</div>
<script>
  (function () {
    var back = document.getElementById('mvBack');
    function close() { back.style.display = 'none'; }
    document.getElementById('mvClose').addEventListener('click', close);
    back.addEventListener('click', function (e) { if (e.target === back) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  })();
</script>
